<div ng-if="$ctrl.usuario" class="fade-in">
    <h2>Perfil de {{$ctrl.usuario.username}}</h2>
    <div style="background: #222; padding: 20px; border-radius: 8px; margin-bottom: 30px;">
        <p><strong>Plan de Suscripción:</strong> {{$ctrl.usuario.planSuscripcion.tarifaPlana ? 'Tarifa Plana VIP' : 'Pago por Visión'}}</p>
        <p><strong>IBAN:</strong> {{$ctrl.usuario.iban.numeroCuenta}}</p>
    </div>

    <h3>Resumen de tus Series</h3>
    <ul style="font-size: 1.1em; line-height: 1.8;">
        <li ng-repeat="(titulo, estado) in $ctrl.usuario.estadoSeries">
            <strong>{{titulo}}</strong>: 
            <span ng-class="{
                'success': estado === 'TERMINADA', 
                'error': estado === 'PENDIENTE', 
                'info': estado === 'EMPEZADA'
            }">{{estado}}</span>
        </li>
    </ul>
    <p ng-if="!$ctrl.usuario.estadoSeries">Aún no tienes actividad en tu cuenta.</p>
</div>
