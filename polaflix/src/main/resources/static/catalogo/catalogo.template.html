<section>
    <h2 style="margin-bottom: 25px;">Catálogo Completo</h2>
    <div class="grid-series">
        <div class="card-serie" ng-repeat="s in $ctrl.series">
            
            <span class="badge badge-pendiente" ng-if="s.estadoPersonal === 'PENDIENTE'">🕒 PENDIENTE</span>
            <span class="badge badge-empezada" ng-if="s.estadoPersonal === 'EMPEZADA'">▶️ EMPEZADA</span>
            <span class="badge badge-terminada" ng-if="s.estadoPersonal === 'TERMINADA'">✅ TERMINADA</span>

            <img ng-src="images/{{s.id}}.jpg" class="serie-poster" alt="{{s.titulo}}" onerror="this.src='images/placeholder.jpg'">
            <div class="card-info">
                <h3>{{s.titulo}}</h3>
                <div style="display:flex; gap: 5px; margin-top: 15px;">
                    <a href="#!/series/{{s.id}}" class="btn-primary btn-sm">Ver Serie</a>
                    
                    <button ng-if="!s.estadoPersonal" ng-click="$ctrl.addPendiente(s.id)" class="btn-secondary btn-sm">
                        ➕ Pendiente
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>
