<section>
    <h2 style="font-size: 2em; margin-bottom: 40px; color: white;">Catálogo Completo</h2>
    
    <div class="shelf-container">
        <div class="shelf">
            <div class="card-serie" ng-repeat="s in $ctrl.series">
                
                <span class="badge badge-pendiente" ng-if="s.estadoPersonal === 'PENDIENTE'">🕒 PENDIENTE</span>
                <span class="badge badge-empezada" ng-if="s.estadoPersonal === 'EMPEZADA'">▶️ EMPEZADA</span>
                <span class="badge badge-terminada" ng-if="s.estadoPersonal === 'TERMINADA'">✅ TERMINADA</span>

                <img ng-src="{{$ctrl.getPosterGeneral(s.id)}}" class="serie-poster" alt="{{s.titulo}}">
                
                <div class="card-info">
                    <h4>{{s.titulo}}</h4>
                    <div style="display:flex; gap: 10px; justify-content: center;">
                        <a href="#!/series/{{s.id}}" class="btn-primary">Ver</a>
                        <button ng-if="!s.estadoPersonal" ng-click="$ctrl.addPendiente(s.id)" class="btn-secondary">➕ Lista</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
