<div ng-if="$ctrl.serie" class="fade-in">
    
    <div class="header-detalle">
        <img ng-src="{{$ctrl.getPosterGeneral($ctrl.serie.id)}}" class="poster-detalle">
        <div class="info-texto">
            <h1 style="color: var(--pola-red); margin-top: 0; font-size: 3em;">{{$ctrl.serie.titulo}}</h1>
            <p class="sinopsis" style="font-size: 1.2em; line-height: 1.6;">{{$ctrl.serie.sinopsis}}</p>
            <p><strong>Categoría:</strong> <span class="badge badge-empezada">{{$ctrl.serie.categoria}}</span></p>
            <p><strong>Precio por Capítulo:</strong> {{$ctrl.serie.costeVisionado}} €</p>
        </div>
    </div>

    <p ng-if="$ctrl.mensajeError" class="error">{{$ctrl.mensajeError}}</p>
    <p ng-if="$ctrl.mensajeExito" class="success">{{$ctrl.mensajeExito}}</p>

    <div class="listado-episodios" style="margin-top: 40px;">
        <h2 style="border-bottom: 1px solid #444; padding-bottom: 10px;">Episodios</h2>

        <div class="temporada-card" ng-repeat="temp in $ctrl.serie.temporadas | orderBy:'numero'">
            
            <img ng-src="{{$ctrl.getPosterTemporada($ctrl.serie.id, temp.numero)}}" class="temporada-poster">
            
            <div class="temporada-info">
                <h3 style="margin-top: 0;">Temporada {{temp.numero}}</h3>
                <p style="color: #999;">Selecciona un número para marcar el capítulo como visto:</p>
                
                <div class="capitulos-grid">
                    <button class="capitulo-btn" 
                            title="{{cap.titulo}}" 
                            ng-repeat="cap in temp.capitulos | orderBy:'numero'" 
                            ng-click="$ctrl.marcarVisto(cap.id)">
                        {{cap.numero}}
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
